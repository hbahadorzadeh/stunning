name: Release

# Releases are driven by the version in main.go. On a push to main (or a manual
# dispatch) the prepare job reads that version and, if the matching tag does not
# yet exist, creates it and runs the full build/release in the SAME run (a tag
# pushed by GITHUB_TOKEN cannot trigger a separate workflow, so everything stays
# in one run). Pushing a v*.*.* tag by hand also works.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Determine the version, auto-create the tag, and decide whether to release.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      do_release: ${{ steps.v.outputs.do_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        name: Resolve version + tag
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            do_release=true
          else
            version=$(grep -oE 'version = "[^"]+"' main.go | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$version" ]; then echo "could not read version from main.go" >&2; exit 1; fi
            if git rev-parse "v$version" >/dev/null 2>&1; then
              echo "tag v$version already exists -- nothing to release"
              do_release=false
            else
              do_release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "do_release=$do_release" >> "$GITHUB_OUTPUT"
          echo "version=$version do_release=$do_release"
      - name: Create and push tag
        if: github.ref_type != 'tag' && steps.v.outputs.do_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "Release v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

  # ---------------------------------------------------------------------------
  # CLI tool — linux/darwin/windows × amd64/arm64. Pure Go, no CGO.
  # Named stunning-cli-<os>-<arch>[.exe] to distinguish it from the desktop app.
  # ---------------------------------------------------------------------------
  release-cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v -trimpath -o "stunning-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: stunning-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # C shared library — bundled with its header into one archive per platform.
  # ---------------------------------------------------------------------------
  release-library:
    name: Library ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, lib: libstunning.so, cc: "" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, lib: libstunning.so, cc: aarch64-linux-gnu-gcc }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, lib: libstunning.dll, cc: x86_64-w64-mingw32-gcc }
          - { os: macos-latest, goos: darwin, goarch: arm64, lib: libstunning.dylib, cc: "clang -arch arm64" }
          - { os: macos-latest, goos: darwin, goarch: amd64, lib: libstunning.dylib, cc: "clang -arch x86_64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Install cross toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64
      - name: Build C library
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: go build -v -trimpath -buildmode=c-shared -o "${{ matrix.lib }}" ./clib/
      - name: Bundle library + header
        run: |
          pkg="libstunning-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir "$pkg"
          mv "${{ matrix.lib }}" "$pkg"/
          mv libstunning.h "$pkg"/ 2>/dev/null || true
          tar -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: library-${{ matrix.goos }}-${{ matrix.goarch }}
          path: libstunning-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Docker image — multi-arch CLI runtime published to GHCR.
  # ---------------------------------------------------------------------------
  release-docker:
    name: Docker image
    needs: prepare
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  # ---------------------------------------------------------------------------
  # Desktop app (Fyne GUI) — built natively per OS, packaged into one archive.
  # ---------------------------------------------------------------------------
  release-desktop:
    name: Desktop ${{ matrix.label }}
    needs: prepare
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-amd64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: windows-latest, label: windows-amd64 }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev
      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Package desktop (Linux)
        if: runner.os == 'Linux'
        env: { CGO_ENABLED: 1 }
        run: |
          go build -v -trimpath -o stunning-desktop ./app/desktop/
          tar -czf "stunning-desktop-${{ matrix.label }}.tar.gz" stunning-desktop
      - name: Package desktop (macOS)
        if: runner.os == 'macOS'
        env: { CGO_ENABLED: 1 }
        run: |
          fyne package -os darwin -appID io.github.hbahadorzadeh.stunning -name Stunning \
            -icon "$GITHUB_WORKSPACE/app/desktop/assets/icon.png" --src ./app/desktop
          zip -r -q "stunning-desktop-${{ matrix.label }}.zip" Stunning.app
      - name: Package desktop (Windows)
        if: runner.os == 'Windows'
        env: { CGO_ENABLED: 1 }
        run: |
          fyne package -os windows -appID io.github.hbahadorzadeh.stunning -name Stunning -icon "$env:GITHUB_WORKSPACE\app\desktop\assets\icon.png" --src ./app/desktop
          Compress-Archive -Path Stunning.exe -DestinationPath "stunning-desktop-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: stunning-desktop-${{ matrix.label }}.*
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Android — APK (sideload) + AAR (binding library). Play Store distribution
  # (publish-google-play) generally requires an AAB; wire that in when enabling.
  # ---------------------------------------------------------------------------
  release-android:
    name: Android
    needs: prepare
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-33 ndk;25.1.8937393 build-tools;33.0.2'
      - name: Install Fyne + gomobile + x/mobile
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          gomobile init
      - name: Build APK
        run: |
          fyne package -os android -appID io.github.hbahadorzadeh.stunning -name Stunning \
            -icon "$GITHUB_WORKSPACE/app/mobile/assets/icon.png" --src ./app/mobile
          mv Stunning.apk stunning-android.apk
      - name: Build AAR binding
        run: gomobile bind -target android -androidapi 21 -o libstunning.aar ./bindings/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: |
            stunning-android.apk
            libstunning.aar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # iOS — xcframework (binding) is reliable; the .ipa needs signing.
  # ---------------------------------------------------------------------------
  release-ios:
    name: iOS
    needs: prepare
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Install Fyne + gomobile + x/mobile
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          gomobile init
      - name: Build iOS binding (xcframework)
        run: gomobile bind -target ios -o Stunning.xcframework ./bindings/
      - name: Package unsigned IPA (best effort)
        env: { CGO_ENABLED: 1 }
        run: |
          fyne package -os ios -appID io.github.hbahadorzadeh.stunning -name Stunning \
            -icon "$GITHUB_WORKSPACE/app/mobile/assets/icon.png" --src ./app/mobile || \
            echo "iOS .ipa packaging needs signing; see publish-app-store"
      - name: Archive xcframework
        run: zip -r -q stunning-ios-xcframework.zip Stunning.xcframework
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios
          path: |
            stunning-ios-xcframework.zip
            Stunning.ipa
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Collect every artifact and publish a GitHub Release for v<version>.
  # ---------------------------------------------------------------------------
  create-github-release:
    name: GitHub Release
    needs: [prepare, release-cli, release-library, release-desktop, release-android, release-ios]
    if: ${{ always() && needs.prepare.outputs.do_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \
            -o -name '*.aar' -o -name '*.ipa' -o -name 'stunning-cli-*' \) \
            -exec cp {} release-assets/ \;
          echo "=== release assets ==="
          ls -lh release-assets/
          ( cd release-assets && sha256sum * > SHA256SUMS.txt ) || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Store publishing. Gated off by default (skipped) — enable by setting the
  # repository variable PUBLISH_STORES=true and providing the secrets below.
  # ---------------------------------------------------------------------------
  publish-google-play:
    name: Publish to Google Play
    needs: [prepare, release-android]
    if: ${{ needs.prepare.outputs.do_release == 'true' && vars.PUBLISH_STORES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: android
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.hbahadorzadeh.stunning
          releaseFiles: android/stunning-android.apk
          track: internal
          status: completed

  publish-app-store:
    name: Publish to App Store
    needs: [prepare, release-ios]
    if: ${{ needs.prepare.outputs.do_release == 'true' && vars.PUBLISH_STORES == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: ios
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ios/Stunning.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
